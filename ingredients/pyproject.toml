[project]
name = "spiritolo-ingredients"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "spiritolo-common",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "recipegf",
    "boto3>=1.43.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
spiritolo-common = { workspace = true }
# RecipeGF P1 (v0.3.0): id grammar, RecipeValidator, VerbRegistry overlay API,
# namespace registry. The pip-installable package lives in the repo's python/
# subdirectory. Pinned to the v0.3.0 tag — bump deliberately (see P2 spike).
recipegf = { git = "https://github.com/mrjogo/RecipeGF.git", tag = "v0.3.0", subdirectory = "python" }

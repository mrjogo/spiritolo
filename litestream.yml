# Litestream: continuous replication of the SQLite file to an S3-compatible
# bucket (Railway bucket). Every value comes from the environment so the same
# file serves staging and any future environment:
#   LITESTREAM_REPLICA_URL          s3://<bucket>/spiritolo     (non-secret variable)
#   LITESTREAM_ENDPOINT             the bucket's S3 endpoint     (non-secret variable)
#   LITESTREAM_ACCESS_KEY_ID        }  reference variables from the attached
#   LITESTREAM_SECRET_ACCESS_KEY    }  Railway bucket (never literal values)
# The nightly VACUUM INTO snapshot is a separate, operator-driven safety net
# (scripts/snapshot-sqlite.sh); Litestream is the continuous one.
dbs:
  - path: ${SPIRITOLO_DB}
    replicas:
      - type: s3
        url: ${LITESTREAM_REPLICA_URL}
        endpoint: ${LITESTREAM_ENDPOINT}
        force-path-style: true
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 168h
        snapshot-interval: 24h
        sync-interval: 1s

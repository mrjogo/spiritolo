# Litestream: continuous replication of the SQLite file to an S3-compatible
# bucket (the spiritolo-litestream Railway bucket), under the prefix
# `spiritolo/`. Every value comes from the environment — on Railway, reference
# variables pointing at that bucket (`${{spiritolo-litestream.BUCKET}}` …):
#   LITESTREAM_BUCKET               the bucket's (internal) name
#   LITESTREAM_ENDPOINT             the bucket's S3 endpoint
#   LITESTREAM_REGION               the bucket's region
#   LITESTREAM_ACCESS_KEY_ID        }  never literal values
#   LITESTREAM_SECRET_ACCESS_KEY    }
# The nightly VACUUM INTO snapshot is a separate, operator-driven safety net
# (scripts/snapshot-sqlite.sh); Litestream is the continuous one.
dbs:
  - path: ${SPIRITOLO_DB}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: spiritolo
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        force-path-style: true
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 168h
        snapshot-interval: 24h
        sync-interval: 1s

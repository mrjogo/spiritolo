[project]
name = "spiritolo-common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    # [socks] pulls in socksio so the local Ollama client can route through the
    # worker's Tailscale userspace SOCKS proxy (see worker/providers_local.py).
    "httpx[socks]>=0.27",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

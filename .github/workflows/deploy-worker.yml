# Deploy the pipeline worker to Railway when staging advances with a change to
# the worker's code, image, or config. This is the CI-gated alternative to
# Railway's native GitHub deploy-on-push; enable one or the other, not both.
#
# Requires a RAILWAY_TOKEN repo secret (a Railway project token). RECIPEGF_TOKEN
# is a Railway build arg, set on the service — not needed here.

name: Deploy worker to Railway

on:
  push:
    branches: [staging]
    paths:
      - 'ingredients/**'
      - 'common/**'
      - 'scraper/**'
      - 'worker.Dockerfile'
      - 'scripts/worker-entrypoint.sh'
      - 'railway.json'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not set" >&2
            exit 1
          fi
          npm i -g @railway/cli
          railway up --service spiritolo-worker --ci

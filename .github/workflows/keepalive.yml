# Keep-alive ping for the Supabase free-tier database.
#
# Supabase pauses free-tier projects after 7 days with no database activity.
# This workflow calls a trivial RPC a couple of times a week, which executes a
# query in Postgres and so resets the 7-day pause timer.
#
# Why an RPC and not a table read: the data schema is locked down to
# `authenticated` (no anon-readable tables/views), so the only anon-reachable
# surface is the purpose-built `public.keepalive()` function — a SECURITY
# DEFINER `select 1` granted EXECUTE to anon. It exposes no data, so the
# lower-risk publishable (anon) key is all we store, not the service-role key.
# See supabase/migrations/20260630120000_keepalive_rpc.sql.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              e.g. https://<project-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the publishable (anon) key, sb_publishable_…
#
# The job fails (non-zero exit) if the request doesn't return HTTP 200, so a
# broken ping surfaces as a failed Action run / notification.

name: Supabase keep-alive

on:
  schedule:
    # Mon & Thu at 12:00 UTC — two pings/week, comfortably inside the 7-day window.
    - cron: "0 12 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase keep-alive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY secret." >&2
            exit 1
          fi

          # POST to the keepalive() RPC. Headers carry the key; -s/-o discard the
          # body and key so nothing sensitive is printed to the log.
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Length: 0" \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive")

          echo "Supabase keep-alive RPC returned HTTP ${status}"

          if [ "${status}" != "200" ]; then
            echo "Keep-alive ping failed: expected HTTP 200, got ${status}." >&2
            exit 1
          fi

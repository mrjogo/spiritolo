name: Backup staging database

# The export side of the one-time Supabase → SQLite data migration
# (docs/migration.md): dumps the legacy staging Postgres (public + audit
# schemas) as a 7-day workflow artifact that scripts/pg_to_sqlite turns into
# the SQLite file the Railway service imports. Manual-only; the dump never
# touches this repo's code path otherwise. Delete this workflow, the
# SUPABASE_STAGING_DB_URL secret and scripts/backup-supabase.sh once the
# Supabase project is decommissioned. Ongoing backups of the live SQLite
# database are Litestream's job (docs/backups.md).
on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ubuntu-latest ships pg_dump 16; Supabase staging is on Postgres 17,
      # and pg_dump major version must be >= server. Pull 17 from PGDG.
      - name: Install postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # pg_wrapper resolves `pg_dump` to the distro default (16); put 17 first.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Run backup script
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          if [ -z "$SUPABASE_STAGING_DB_URL" ]; then
            echo "SUPABASE_STAGING_DB_URL is not set" >&2
            exit 1
          fi
          pg_dump --version
          ./scripts/backup-supabase.sh

      - name: Upload dump + sidecar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spiritolo-staging-dump-${{ github.run_id }}
          path: |
            spiritolo-staging-*.dump
            spiritolo-staging-*.dump.meta.json
          retention-days: 7
          if-no-files-found: error
